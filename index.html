<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심심할 때 뭐 하지?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f8;
        }

        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .result-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2rem;
            min-height: 200px;
            justify-content: center;
        }

        .card {
            background-color: #f8f9fa;
            border: 2px solid #edf2f7;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            color: #2d3748;
            transition: all 0.2s ease;
            animation: fadeIn 0.4s ease;
        }

        .card:hover {
            border-color: #4c51bf;
            transform: translateY(-2px);
        }

        .btn {
            background-color: #4c51bf;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #434190;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>심심할 때 뭐 하지? 🤔</h1>
        <p class="subtitle">버튼을 눌러 오늘 할 일을 추천받아보세요!</p>

        <div class="result-box" id="resultBox">
            <p style="color: #a0aec0;">아래 버튼을 눌러주세요!</p>
        </div>

        <button class="btn" id="actionBtn" onclick="recommend()">추천 받기</button>
    </div>

    <script>
        // 심심할 때 할 일 목록 데이터베이스
        const activityList = [
            "🍿 안 본 최신 OTT 영화나 드라마 정주행하기",
            "🏃‍♂️ 근처 안 가본 공원이나 길 산책하고 오기",
            "🧹 방 책상 위 깔끔하게 정리하고 먼지 털기",
            "☕ 집 주변 평점 높은 카페 가서 시그니처 음료 마시기",
            "🎨 온라인에서 무료 심리 테스트/성격 테스트 해보기",
            "📖 밀린 책이나 웹툰 3화 이상 읽기",
            "🎧 최신 음악 차트 Top 50 들어가서 새로운 노래 찾기",
            "🧩 모바일 미니 게임 다운받아서 30분 동안 해보기",
            "🧘 유튜브 보면서 10분 스트레칭 따라 하기",
            "🍳 냉장고 속 재료로 새로운 요리 만들어 보기",
            "📝 올해 가보고 싶은 여행지 버킷리스트 5개 작성하기",
            "🌏 구글 어스(Google Earth)로 랜선 세계 여행 떠나기"
        ];

        function recommend() {
            const resultBox = document.getElementById('resultBox');
            const actionBtn = document.getElementById('actionBtn');

            // 리스트 복사 후 랜덤으로 섞기 (Fisher-Yates Shuffle)
            const shuffled = [...activityList].sort(() => 0.5 - Math.random());
            
            // 상위 3개 추출
            const selected = shuffled.slice(0, 3);

            // 화면에 카드 형태로 출력
            resultBox.innerHTML = selected.map(item => `
                <div class="card">${item}</div>
            `).join('');

            // 첫 실행 이후 버튼 텍스트를 '다시하기'로 변경
            actionBtn.innerText = "다시하기 🔄";
        }
    </script>
</body>
</html>
